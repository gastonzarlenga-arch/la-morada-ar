name: Publicar La Morada AR (FTPS)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: la-morada-ar-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ar-staging
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Validar configuracion
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -s site/index.html || { echo "::error::Falta site/index.html"; exit 1; }
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo "::error::Faltan secretos FTPS"; exit 1; }
          test "$FTP_REMOTE_DIR" = "staging/" || { echo "::error::FTP_REMOTE_DIR debe ser exactamente staging/"; exit 1; }
          echo "Variables presentes; no se muestran credenciales."

      - name: Registrar IP publica del runner (para diagnostico Webempresa)
        run: |
          echo "IP de salida GitHub (puede variar entre ejecuciones):"
          curl --fail --silent --show-error --max-time 10 https://api.ipify.org || true
          echo

      - name: Comprobar autenticacion FTPS sin subir archivos
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Comprobar login y listado de la raiz FTP, sin desplegar.
          # --ssl-reqd obliga TLS explicito. Nunca habilitar modo sin cifrado.
          set +e
          curl --fail --silent --show-error --max-time 30 --connect-timeout 10 \
            --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
            "ftp://${FTP_HOST}:21/" -o /dev/null
          result=$?
          set -e
          if [ "$result" -eq 67 ]; then
            echo "::error::Servidor FTP rechazo autenticacion (curl 67 / FTP 530). Revisar que FTP_USER y FTP_PASSWORD coincidan con WinSCP y autorizacion de IP/origen de runner."
            exit 67
          fi
          if [ "$result" -ne 0 ]; then
            echo "::error::Prueba FTPS fallo con codigo curl $result. Revisar conexion/listado de raiz."
            exit "$result"
          fi
          echo "Autenticacion FTPS correcta."

      - name: Publicar solo index.html en staging
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            --ssl-reqd --ftp-create-dirs --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file site/index.html \
            "ftp://${FTP_HOST}:21/staging/index.html"
          echo "Transferencia completada. Verificar https://lamoradaburgers.com.ar/menuvr/staging/"
