name: Publicar La Morada AR (FTPS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ar-staging
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Comprobar configuracion y archivo
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -s site/index.html || { echo "::error::Falta site/index.html"; exit 1; }
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo "::error::Faltan secretos FTPS"; exit 1; }
          test "$FTP_REMOTE_DIR" = "staging/" || { echo "::error::FTP_REMOTE_DIR debe ser exactamente staging/ (la cuenta FTP ya apunta a menuvr)"; exit 1; }

      - name: Publicar solo pagina de prueba en staging via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file site/index.html \
            "ftp://${FTP_HOST}:21/staging/index.html"
          echo "Archivo enviado a staging. Verificar la URL publica antes de dar por exitosa la publicacion."
