<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LA MORADA AR V16 — Prueba oficial mínima</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161616;color:#fff;font-family:system-ui,sans-serif}
#label{position:absolute;top:12px;left:12px;right:12px;padding:12px;background:#191919e8;border-left:4px solid #fa831a;z-index:2;pointer-events:none}
#logs{position:absolute;bottom:85px;left:12px;right:12px;max-height:23%;overflow:auto;white-space:pre-wrap;color:#eee;background:#000c;padding:10px;font:11px/1.5 monospace}
#copy{position:absolute;top:16px;right:16px;z-index:3}
body.xr #label,body.xr #logs,body.xr #copy{display:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="label"><strong>LA MORADA AR V16</strong><div id="state">Prueba mínima de renderizado AR</div></div>
<pre id="logs"></pre>
<button id="copy">Copiar registro</button>
<script>
const lines=[];function log(s){lines.push(new Date().toLocaleTimeString('es-AR')+' '+s);document.querySelector('#logs').textContent=lines.slice(-25).join('\n');document.querySelector('#state').textContent=s;}
window.onerror=(m)=>log('ERROR: '+m);
window.onunhandledrejection=e=>log('ERROR promesa: '+String(e.reason));
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText('LA MORADA AR V16\n'+lines.join('\n'));
</script>
<script type="module">
try {
  const THREE=await import('three');
  const { ARButton }=await import('three/addons/webxr/ARButton.js');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,20);
  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,3));

  // Mantener configuración original del ejemplo oficial: sin composiciones manuales.
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);

  let hits=0,frames=0,placed=0,source=null,requested=false;
  const reticle=new THREE.Mesh(
    new THREE.RingGeometry(.15,.2,32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
  );
  reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);

  const cylinder=new THREE.CylinderGeometry(.10,.10,.20,32).translate(0,.10,0);
  const controller=renderer.xr.getController(0);
  controller.addEventListener('select',()=>{
    if(!reticle.visible){log('Toque sin retículo');return;}
    const mesh=new THREE.Mesh(cylinder,new THREE.MeshBasicMaterial({color:0xff8500}));
    reticle.matrix.decompose(mesh.position,mesh.quaternion,mesh.scale);
    scene.add(mesh);
    placed++;log('Colocación número '+placed);
  });
  scene.add(controller);

  document.body.appendChild(ARButton.createButton(renderer,{requiredFeatures:['hit-test']}));
  renderer.xr.addEventListener('sessionstart',()=>{
    document.body.classList.add('xr');frames=hits=placed=0;log('AR iniciada: buscá retículo blanco; tocá para crear cilindro naranja');
  });
  renderer.xr.addEventListener('sessionend',()=>{
    document.body.classList.remove('xr');reticle.visible=false;requested=false;source=null;
    log('Fin AR, frames='+frames+' hits='+hits+' colocados='+placed);
  });

  renderer.setAnimationLoop((_,frame)=>{
    if(frame){
      frames++;
      const session=renderer.xr.getSession();
      const ref=renderer.xr.getReferenceSpace();
      if(!requested){
        requested=true;
        session.requestReferenceSpace('viewer')
          .then(view=>session.requestHitTestSource({space:view}))
          .then(hitSource=>{source=hitSource;log('Fuente Hit Test lista');})
          .catch(e=>log('Hit Test ERROR '+e.message));
        session.addEventListener('end',()=>{requested=false;source=null;},{once:true});
      }
      if(source){
        const results=frame.getHitTestResults(source);
        if(results.length){
          const pose=results[0].getPose(ref);
          if(pose){reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);hits++;}
          else reticle.visible=false;
        }else reticle.visible=false;
      }
      if(frames%180===0)log('XR frames='+frames+' hits='+hits+' reticle='+reticle.visible+' cylinders='+placed);
    }
    renderer.render(scene,camera);
  });

  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  log('Three.js '+THREE.REVISION+' cargó; visor listo. Iniciar AR');
}catch(e){log('ERROR inicio: '+(e.stack||e));}
</script>
</body></html>
